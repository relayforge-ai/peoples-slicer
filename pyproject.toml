[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peoples-slicer"
version = "0.2.0"
description = "The People's Slicer — agent-first headless slice & send, plus a local Studio GUI for humans. MIT."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "People's Slicer contributors" }]
keywords = ["3d-printing", "slicer", "orcaslicer", "bambu", "flashforge", "klipper", "cli", "agent"]
dependencies = []

[project.urls]
Homepage = "https://github.com/relayforge-ai/peoples-slicer"
Repository = "https://github.com/relayforge-ai/peoples-slicer"

[project.optional-dependencies]
bambu = ["paho-mqtt>=2"]
dev = ["pytest>=8"]

[project.scripts]
forge = "forge.cli:main"
peoples = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
# GUI lives at repo-root /gui; include via MANIFEST / package data for sdist.
# Runtime resolves GUI_DIR relative to the package parent (source tree / editable install).

[tool.pytest.ini_options]
testpaths = ["tests"]
